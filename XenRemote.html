
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Google Play...</title>

  <!-- GoatCounter tracking -->
  <script
    data-goatcounter="https://nextgenappcreator.goatcounter.com/count"
    data-goatcounter-settings='{"no_onload":true}'
    async
    src="https://gc.zgo.at/count.js"
    onload="window.goatcounter.count({path:'/xenremote'})">
  </script>

  <script>
    var PACKAGE = "com.nextgenapp.xenremote";

    var playStoreUrl =
      "https://play.google.com/store/apps/details?id=" +
      PACKAGE +
      "&utm_source=qr&utm_medium=offline&utm_campaign=shop_a";

    setTimeout(function() {
      window.location.replace(playStoreUrl);
    }, 1500);
  </script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:50px">
    Redirecting to Google Play...
    <br><br>
    <a id="fallback" href="#">Tap here if it doesn't open automatically</a>
  </p>

  <script>
    document.getElementById("fallback").href = playStoreUrl;
  </script>
</body>
</html>

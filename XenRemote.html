
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening XenRemote...</title>
  <!-- GoatCounter Analytics -->
 <script data-goatcounter="https://nextgenappcreator.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <script>
    const PACKAGE = "com.nextgenapp.xenremote";
    const playStoreUrl =
      "https://play.google.com/store/apps/details?id=" +
      PACKAGE +
      "&utm_source=insta&utm_medium=online&utm_campaign=nextgeninstapage";

    // Redirect after allowing analytics to load
    setTimeout(function () {
      window.location.replace(playStoreUrl);
    }, 1500);
  </script>
</head>

<body>
  <p style="font-family:Arial,sans-serif;text-align:center;margin-top:50px">
    Opening XenRemote on Google Play...
    <br><br>
    <a id="fallback" href="#">Tap here if you are not redirected</a>
  </p>

  <script>
    document.getElementById("fallback").href = playStoreUrl;
  </script>
</body>
</html>

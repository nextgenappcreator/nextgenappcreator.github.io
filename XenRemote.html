<head>
  <meta charset="UTF-8">
  <title>Opening Google Play...</title>
  
  <!-- 1. Paste your free Cloudflare Web Analytics / GoatCounter script here -->

  <script>
    var PACKAGE = "com.nextgenapp.xenremote";
    var utm = "&utm_source=github&utm_medium=online&utm_campaign=instagram";
    var playStoreUrl = "https://play.google.com/store/apps/details?id=" + PACKAGE + utm;

    // Give the analytics script 300ms to fire the "scan" ping, then immediately open Play Store
    setTimeout(function() {
      window.location.replace(playStoreUrl);
    }, 300);
  </script>
</head>
<body>
  <!-- Fallback link just in case a phone's browser blocks auto-redirects -->
  <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    Redirecting to Google Play... <br><br>
    <a id="fallback" href="#">Tap here if it doesn't open automatically</a>
  </p>
  <script>
    document.getElementById("fallback").href = playStoreUrl;
  </script>
</body>

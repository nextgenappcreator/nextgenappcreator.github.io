<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XenRemote - Google Play</title>

  <script>
    var rawTag = window.location.hash.replace("#", "").trim().toLowerCase();
    var shopId = rawTag.replace(/[^a-z0-9_-]/g, "") || "direct";

    // Tell GoatCounter which shop or channel scanned the link
    window.goatcounter = {
      path: "/DownloadXenRemote-" + shopId,
      title: "DownloadXenRemote (" + shopId + ")"
    };

    // Use source="instagram" if hash is #insta or #ig, otherwise "shop_qr"
    var source = (shopId === "insta" || shopId === "ig") ? "instagram" : "shop_qr";
    var medium = (source === "instagram") ? "social" : "offline";

    var PACKAGE = "com.nextgenapp.xenremote";
    var utm = "&utm_source=" + source + "&utm_medium=" + medium + "&utm_campaign=" + shopId;
    var playStoreUrl = "https://play.google.com/store/apps/details?id=" + PACKAGE + utm;
   

    var redirected = false;
    function goToStore() {
      if (redirected) return;
      redirected = true;
      window.location.replace(playStoreUrl);
    }

    // Redirect after 1200ms so GoatCounter finishes counting on slower mobile networks
    setTimeout(goToStore, 1200);
  </script>

  <!-- Replace YOUR_CODE with your actual GoatCounter site code -->
  <script data-goatcounter="https://nextgenappcreator.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #202124;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: #01875f;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <p>Opening <strong>XenRemote</strong> on Google Play...</p>
  <a id="fallback" class="btn" href="#">Open Google Play Store</a>

  <script>
    var btn = document.getElementById("fallback");
    btn.href = playStoreUrl;
    btn.addEventListener("click", function () {
      redirected = true;
    });
  </script>
</body>
</html>
